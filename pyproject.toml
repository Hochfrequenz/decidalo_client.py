[project]
name = "decidalo_client"
description = "An async Python client for the decidalo V3 Import API"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Hochfrequenz Unternehmensberatung GmbH", email = "info@hochfrequenz.de" }]
keywords = ["decidalo", "api", "client", "async", "aiohttp", "pydantic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "aiohttp>=3.10,<3.14",
    "pydantic>=2.5",
]
dynamic = ["readme", "version"]

[project.urls]
Changelog = "https://github.com/Hochfrequenz/decidalo_client.py/releases"
Homepage = "https://github.com/Hochfrequenz/decidalo_client.py"

[dependency-groups]
tests = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "aioresponses==0.7.9",
]
linting = [
    "ruff==0.16.1",
]
type_check = [
    "mypy==2.3.0",
    "mypy[pydantic]",
    { include-group = "tests" },
]
spell_check = [
    "codespell==2.4.3",
]
coverage = [
    "coverage==7.15.2",
    { include-group = "tests" },
]
codegen = [
    "datamodel-code-generator==0.71.0",
    { include-group = "linting" },
]
dev = [
    { include-group = "tests" },
    { include-group = "linting" },
    { include-group = "type_check" },
    { include-group = "coverage" },
    { include-group = "spell_check" },
    { include-group = "codegen" },
]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "N", "PL", "RUF"]
ignore = [
    "PLR0913", # too-many-arguments
    "PLR0917", # too-many-positional-arguments
    "PLR0912", # too-many-branches
    "PLR0915", # too-many-statements
    "PLR2004", # magic-value-comparison
    "RUF001",  # ambiguous-unicode-character-string
    "RUF002",  # ambiguous-unicode-character-docstring
    "RUF003",  # ambiguous-unicode-character-comment
    "N815",    # mixed-case-variable-in-class-scope (pydantic models mirror the decidalo API's camelCase fields)
]

[tool.ruff.lint.per-file-ignores]
"src/decidalo_client/client.py" = ["PLR0904"] # too-many-public-methods
"unittests/**" = [
    "E501",    # line-too-long (tests previously allowed lines up to 150 chars)
    "E402",    # module-import-not-at-top-of-file
    "PLC0415", # import-outside-toplevel
]

[tool.mypy]
disable_error_code = []
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "decidalo_client.models._autogenerated"
ignore_errors = true

[build-system]
requires = ["hatchling>=1.8.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/_decidalo_client_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build.targets.sdist]
exclude = ["/unittests"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
