name: "Linting"

on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  lint:
    name: "Python Code Quality and Lint (${{ matrix.group }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - group: linting
            commands: |
              uv run --group linting ruff check src/decidalo_client --exclude _autogenerated.py
              uv run --group linting ruff check src/decidalo_app_client
              uv run --group linting ruff check unittests
          - group: type_check
            commands: |
              uv run --group type_check mypy --show-error-codes src/decidalo_client --strict --ignore-missing-imports
              uv run --group type_check mypy --show-error-codes src/decidalo_app_client --strict --ignore-missing-imports
              uv run --group type_check mypy --show-error-codes unittests --strict --ignore-missing-imports
          - group: spell_check
            commands: |
              uv run --group spell_check codespell --ignore-words=domain-specific-terms.txt --skip=_autogenerated.py src
              uv run --group spell_check codespell --ignore-words=domain-specific-terms.txt README.md
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: 3.14
      - name: Run ${{ matrix.group }}
        run: |
          ${{ matrix.commands }}
