name: "Coverage"

on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: 3.14
      - name: Run Tests and Record Coverage
        working-directory: unittests
        env:
          PYTHONPATH: ../src
        run: |
          uv run --group coverage coverage run -m pytest
          uv run --group coverage coverage html --omit ".tox/*,unittests/*,*/decidalo_app_client/auth.py"
          uv run --group coverage coverage report --fail-under 80 --omit ".tox/*,unittests/*,*/decidalo_app_client/auth.py"
