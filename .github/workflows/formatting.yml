name: "Formatting"

on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  format:
    # The "black"/"isort" matrix values are kept as-is (rather than renamed to "ruff") because
    # they are required status check names in the branch ruleset; renaming them would leave the
    # old check names permanently pending. Both now run ruff under the hood. Renaming these
    # requires updating the ruleset's required-status-check list in the same change.
    name: "format (${{ matrix.tool }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - tool: black
            command: "ruff format --check ."
          - tool: isort
            command: "ruff check --select I ."
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: 3.14
      - name: ${{ matrix.tool }} Code Formatter
        run: |
          uv run --group linting ${{ matrix.command }}
